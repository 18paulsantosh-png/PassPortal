<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — PassPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>PassPortal</h1>
        <p>Campus Transport Pass Management System</p>
        <nav>
            <a href="../index.html">Home</a>
            <a href="routes.html">Routes</a>
            <a href="validation.html">Validate Pass</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container form-container-wide animate-in">
            <div class="form-header">
                <h2>Create Your Account</h2>
                <p>Register to apply for your campus transport pass</p>
            </div>

            <form id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="student-id">Student ID</label>
                        <input type="text" id="student-id" placeholder="e.g. STU2026001" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input type="email" id="register-email" placeholder="you@college.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+91 9876543210" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="course">Course / Department</label>
                        <input type="text" id="course" placeholder="e.g. B.Tech CSE" required>
                    </div>
                    <div class="form-group">
                        <label for="year">Year of Study</label>
                        <select id="year" required>
                            <option value="" disabled selected>Select year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="Create a strong password" required>
                    <div class="password-strength-container">
                        <div id="password-strength" style="height: 4px; border-radius: 2px; transition: width 0.3s ease, background 0.3s ease; width: 0%;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the <a href="#" class="link">Terms &amp; Conditions</a> and <a href="#" class="link">Privacy Policy</a></span>
                    </label>
                </div>

                <div id="register-message" class="form-message"></div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div class="form-links">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>PassPortal — Campus Transport Pass Management System</p>
        <p>© 2026–2027 | Student Project</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
