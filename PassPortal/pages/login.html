<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PassPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>PassPortal</h1>
        <p>Campus Transport Pass Management System</p>
        <nav>
            <a href="../index.html">Home</a>
            <a href="routes.html">Routes</a>
            <a href="validation.html">Validate Pass</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container animate-in">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Sign in to manage your transport pass</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@college.edu" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <button type="button" id="toggle-password" class="toggle-password-btn" title="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-role">Login As</label>
                    <select id="login-role" required>
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div id="login-message" class="form-message"></div>

                <button type="submit" class="btn btn-primary btn-block">Sign In →</button>
            </form>

            <div class="form-links">
                <a href="forgot-password.html">Forgot your password?</a>
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>PassPortal — Campus Transport Pass Management System</p>
        <p>© 2026–2027 | Student Project</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
