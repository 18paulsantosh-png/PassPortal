<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — PassPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>PassPortal</h1>
        <p>Campus Transport Pass Management System</p>
        <nav>
            <a href="../index.html">Home</a>
            <a href="routes.html">Routes</a>
            <a href="validation.html">Validate Pass</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container animate-in">
            <div class="form-header">
                <h2>Reset Password</h2>
                <p>Enter your email and set a new password</p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="reset-email">Registered Email</label>
                    <input type="email" id="reset-email" placeholder="you@college.edu" required>
                </div>

                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter a new password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" placeholder="Re-enter new password" required>
                </div>

                <div id="reset-message" class="form-message"></div>

                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            </form>

            <div class="form-links">
                <p>Remembered your password? <a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>PassPortal — Campus Transport Pass Management System</p>
        <p>© 2026–2027 | Student Project</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
