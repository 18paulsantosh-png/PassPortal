<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <script src="../../script.js" defer></script>
    <title>Route Management | PassPortal</title>
</head>
<body>
    <header>
        <h1>PassPortal</h1>
        <p>Route Management</p>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="routes.html">Routes</a>
            <a href="applications.html">Applications</a>
            <a href="payments.html">Payments</a>
            <a href="passes.html">Passes</a>
            <a href="../login.html">Logout</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add New Route</h2>
            <form id="admin-route-form">
                <p>
                    <label for="new-route-id">Route ID</label>
                    <input type="text" id="new-route-id" name="routeId" placeholder="e.g. R005" required>
                </p>
                <p>
                    <label for="new-route-name">Route Name</label>
                    <input type="text" id="new-route-name" name="routeName" placeholder="e.g. Ludhiana" required>
                </p>
                <p>
                    <label for="new-route-stops">Pickup Stops</label>
                    <input type="text" id="new-route-stops" name="routeStops" placeholder="e.g. Main Market → Bus Stand → Campus" required>
                </p>
                <p>
                    <label for="new-route-fare">Monthly Fare (₹)</label>
                    <input type="number" id="new-route-fare" name="routeFare" placeholder="e.g. 1200" min="0" required>
                </p>
                <p>
                    <button type="submit">➕ Add Route</button>
                </p>
                <div id="admin-routes-message"></div>
            </form>
        </section>

        <section>
            <h2>Existing Routes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Route ID</th>
                        <th>Name</th>
                        <th>Stops</th>
                        <th>Fare</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-routes-table-body">
                    <tr><td colspan="5" style="text-align:center; padding:40px;">Loading routes...</td></tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>Quick Links</h2>
            <p><a href="dashboard.html">← Back to Dashboard</a></p>
        </section>
    </main>

    <footer>
        <p>PassPortal — Campus Transport Pass Management System</p>
        <p>© 2026–2027 | Student Project</p>
    </footer>
</body>
</html>
